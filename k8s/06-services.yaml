apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: social-network
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: social-network
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: social-network
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: social-network
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
