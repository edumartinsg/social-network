name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start disposable Postgres for tests
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=social_network_test \
            -p 5544:5432 \
            pgvector/pgvector:pg16

      - name: Start disposable Redis for tests
        run: |
          docker run -d --name ci-redis \
            -p 6390:6379 \
            redis:7-alpine

      - name: Wait for Postgres to be ready
        run: |
          until docker exec ci-postgres pg_isready -U postgres; do
            echo "waiting for postgres..."
            sleep 1
          done

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

      - name: Run migrations against test database
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5544/social_network_test
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5544/social_network_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5544/social_network_test
          REDIS_URL: redis://localhost:6390
          JWT_SECRET: ci-test-secret-not-for-production
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET_NAME: social-network-uploads
          OLLAMA_URL: http://localhost:11434
        run: npm test

      - name: Clean up disposable containers
        if: always()
        run: |
          docker rm -f ci-postgres ci-redis

  build:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: api
        run: docker build -t social-network-api:${{ github.sha }} .

      - name: Import image into k3d cluster
        run: k3d image import social-network-api:${{ github.sha }} -c social-network
